<script>
        // Global Toast Notification Helper
        window.showToast = function(message, type = 'success') {
            let container = document.getElementById('global-toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'global-toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            
            const card = document.createElement('div');
            card.className = `toast-card ${type}`;
            
            let iconName = 'check_circle';
            if (type === 'error') iconName = 'error';
            if (type === 'warning') iconName = 'warning';
            
            card.innerHTML = `
                <span class="material-symbols-outlined text-[24px]" style="color: ${type==='success'?'#116c4a':type==='error'?'#ba1a1a':'#3a2017'}">${iconName}</span>
                <span class="font-label-md text-label-md text-[#191c1d]">${message}</span>
            `;
            
            container.appendChild(card);
            
            // Trigger animation
            setTimeout(() => {
                card.classList.add('show');
            }, 10);
            
            // Dismiss after 4 seconds
            setTimeout(() => {
                card.classList.remove('show');
                setTimeout(() => {
                    card.remove();
                }, 300);
            }, 4000);
        };

        // Retrieve and display phone number entered at Login
        const savedPhone = sessionStorage.getItem('agriscan_phone');
        if (savedPhone) {
            const subTitle = document.querySelector('.text-on-surface-variant');
            if (subTitle) {
                subTitle.innerHTML = `We've sent a 6-digit verification code to <span class="font-bold text-on-surface">${savedPhone}</span>`;
            }
        }

        // Autofill Demo OTP Helper
        window.fillDemoOtp = function() {
            const demoCode = ['8', '4', '7', '2', '9', '1'];
            const inputs = document.querySelectorAll('.otp-input');
            inputs.forEach((input, i) => {
                input.value = demoCode[i] || '';
            });
            window.showToast("Demo OTP code 847291 filled! Click Verify Account.", "success");
            if (inputs[5]) inputs[5].focus();
        };

        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 6).split('');
                pasteData.forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                    }
                });
                if (inputs[pasteData.length]) {
                    inputs[pasteData.length].focus();
                } else {
                    inputs[5].focus();
                }
            });
        });

        // Timer Logic
        let timeLeft = 120;
        let timerInterval;
        const countdownEl = document.getElementById('countdown');
        const timerContainer = document.getElementById('timer-container');
        const resendBtn = document.getElementById('resend-btn');

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerContainer.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);
        }

        // Start initially
        startTimer();

        resendBtn.addEventListener('click', () => {
            window.showToast('A new 6-digit verification code has been sent!', 'success');
            timeLeft = 120;
            timerContainer.classList.remove('hidden');
            resendBtn.classList.add('hidden');
            inputs.forEach(i => i.value = '');
            inputs[0].focus();
            startTimer();
        });

        // Form Submit
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const otp = Array.from(inputs).map(i => i.value).join('');
            if (otp.length === 6) {
                const btn = e.target.querySelector('button');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Verifying...';
                btn.disabled = true;
                
                setTimeout(() => {
                    window.showToast('Phone verified successfully! Calibrating farm twin...', 'success');
                    setTimeout(() => {
                        window.location.href = "../create_account_farm_profile/code.html";
                    }, 1200);
                }, 1500);
            } else {
                window.showToast('Please enter the complete 6-digit code.', 'error');
            }
        });
    </script>
